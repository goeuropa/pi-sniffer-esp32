; PlatformIO Project Configuration File for ESP32 BLE Sniffer
; Core functionality: BLE device scanning and REST API data reporting

[env:esp32s3]
platform = espressif32
board = esp32-s3-devkitc-1
framework = espidf
monitor_speed = 115200
build_flags = 
    -DDEVICE_NAME=\"5003\"

; Custom partition table with larger app partition
board_build.partitions = partitions.csv

; Upload settings
upload_speed = 921600

; ESP32-S3 specific settings
board_build.flash_mode = dio
board_build.flash_size = 16MB
board_upload.flash_size = 16MB

[env:esp32s3-debug]
extends = env:esp32s3
build_type = debug
